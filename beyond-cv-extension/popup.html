<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beyond CV</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="header">
      <div>
        <p class="eyebrow">Beyond CV</p>
        <h1>招聘表单填入助手</h1>
      </div>
      <span id="statusDot" class="dot"></span>
    </header>

    <section class="panel">
      <div class="row">
        <div>
          <p class="label">当前页面</p>
          <p id="pageTitle" class="page-title">等待扫描</p>
        </div>
        <button id="scanButton" type="button">AI 识别</button>
      </div>
      <p id="scanStatus" class="muted">打开招聘网站后点击 AI 识别，插件会结合完整资料库判断每个字段该填什么。</p>
    </section>

    <section class="panel ai-panel">
      <div class="row">
        <div>
          <p class="label">AI 识别设置</p>
          <p id="aiSettingsStatus" class="page-title">未保存 Key</p>
        </div>
        <button id="testAiSettingsButton" class="secondary" type="button">测试</button>
      </div>
      <input id="aiApiKeyInput" class="sync-input sensitive-input" type="password" autocomplete="off" placeholder="DeepSeek API Key" />
      <div class="sync-grid">
        <input id="aiModelInput" class="sync-input" placeholder="deepseek-v4-flash" />
        <input id="aiBaseUrlInput" class="sync-input" placeholder="https://api.deepseek.com" />
      </div>
      <button id="saveAiSettingsButton" class="secondary full" type="button">保存 AI 设置</button>
    </section>

    <section class="panel application">
      <div class="row">
        <div>
          <p class="label">投递记录</p>
          <p id="applicationPageHint" class="page-title">当前页面</p>
        </div>
        <span id="applicationCount" class="pill">0</span>
      </div>
      <div class="sync-grid application-grid">
        <input id="applicationCompanyInput" class="sync-input" placeholder="公司" />
        <input id="applicationRoleInput" class="sync-input" placeholder="岗位" />
      </div>
      <div class="sync-grid application-grid">
        <select id="applicationStatusInput" class="sync-input">
          <option value="已投递">已投递</option>
          <option value="准备中">准备中</option>
          <option value="笔试">笔试</option>
          <option value="面试">面试</option>
          <option value="Offer">Offer</option>
          <option value="未通过">未通过</option>
        </select>
        <button id="recordApplicationButton" class="secondary" type="button">记录本次投递</button>
      </div>
      <p id="applicationStatus" class="sync-status">记录后会同步到 Beyond CV 投递管理。</p>
    </section>

    <section class="panel profile">
      <div class="row">
        <div>
          <p class="label">本地资料</p>
          <p id="profileName" class="page-title">未读取</p>
        </div>
        <button id="editProfileButton" class="secondary" type="button">编辑</button>
      </div>
      <button id="importProfileButton" class="secondary full" type="button">从 Beyond CV 页面导入资料</button>
      <div class="cloud-sync">
        <div class="sync-grid">
          <input id="accountEmailInput" class="sync-input" type="email" autocomplete="email" placeholder="账户邮箱" />
          <input id="accountPasswordInput" class="sync-input" type="password" autocomplete="current-password" placeholder="密码" />
        </div>
        <div class="sync-grid">
          <button id="loginAccountButton" class="secondary" type="button">登录账户</button>
          <button id="logoutAccountButton" class="secondary" type="button">退出</button>
        </div>
        <p id="accountStatus" class="sync-status">未登录，可使用同步码</p>
        <input id="syncTokenInput" class="sync-input" placeholder="粘贴 Supabase 同步码" />
        <button id="cloudSyncButton" class="secondary full" type="button">从云端同步资料</button>
      </div>
      <button id="directFillButton" class="full" type="button">全表扫描并填入</button>
    </section>

    <section class="panel">
      <div class="row">
        <p class="label">匹配结果</p>
        <span id="matchCount" class="pill">0</span>
      </div>
      <div id="fieldList" class="field-list"></div>
    </section>

    <footer class="footer">
      <button id="fillButton" type="button">填入已选字段</button>
      <button id="clearButton" class="secondary" type="button">清除标记</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
